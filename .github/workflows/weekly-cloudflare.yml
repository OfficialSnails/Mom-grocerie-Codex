name: Weekly grocery update

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Thursdays around 08:00 in Toronto during daylight saving time.
    - cron: "0 12 * * 4"

permissions:
  contents: read

env:
  TZ: America/Toronto

defaults:
  run:
    shell: bash

jobs:
  review:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run qa:pantry && npm run qa:categories

  weekly:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: production-grocery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if the flyer week is already in Git
        id: cycle
        if: github.event_name == 'schedule'
        run: |
          expected=$(node --import tsx --input-type=module -e 'import { frenchWeekFolderName } from "./src/weekly-files.ts"; console.log(frenchWeekFolderName(new Date()))')
          current=$(jq -er '.weeks[0].folderName' website/data/weeks/index.json)
          if [[ "$current" == "$expected" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Already on main: $current"
          fi

      - name: Generate weekly grocery data
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.cycle.outputs.current != 'true')
        id: generate
        run: npm run weekly
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          BONS_SPECIAUX_IGNORE_RATE_LIMIT: "1"

      - name: Validate release
        run: npm run check

      - name: Validate grocery categories
        run: npm run qa:pantry && npm run qa:categories

      - name: Reject snapshots older than production
        run: |
          live=$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            "https://bons-speciaux-joliette.pages.dev/data/weeks/index.json?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" |
            jq -er '.weeks[0].generatedAt')
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const local = JSON.parse(readFileSync("website/data/weeks/index.json", "utf8")).weeks[0]?.generatedAt;
            const live = process.argv[1];
            if (!(Date.parse(local) >= Date.parse(live))) {
              throw new Error("Candidate snapshot (" + local + ") is older than production (" + live + ") or has an invalid date");
            }
          ' "$live"

      - name: Commit weekly output
        if: steps.generate.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update weekly grocery specials"
          file_pattern: "data reports website/data"

      - name: Confirm the release is still on main
        id: main
        run: |
          remote=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$(git rev-parse HEAD)" == "$remote" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main moved during this run. The newer commit's push run owns the release."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.main.outputs.current == 'true'
        run: npx wrangler@4.131.0 pages deploy website --project-name bons-speciaux-joliette --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify published website data
        if: steps.main.outputs.current == 'true'
        run: npm run verify:published
