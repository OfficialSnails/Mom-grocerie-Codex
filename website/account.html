<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Mes listes — La liste d’épicerie</title>
  <link rel="icon" href="./assets/favicon-white.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./account.css" />
</head>
<body class="account-page">
  <a class="skip-link" href="#account-main">Aller à mes listes</a>
  <header class="account-header">
    <a href="./" aria-label="La liste d’épicerie — accueil"><img src="./assets/la-liste-epicerie-logo.png" width="220" height="74" alt="La liste d’épicerie" /></a>
    <a class="account-button" href="./">Voir les prix de la semaine</a>
    <div id="account-auth"><button class="account-access" type="button" disabled>Se connecter</button></div>
  </header>
  <div class="account-layout">
    <aside class="account-sidebar">
      <h1>Mon espace</h1>
      <p id="account-identity">Chargement…</p>
      <nav aria-label="Mon espace">
        <a href="#lists" data-section="lists">Mes listes</a>
        <a href="#archives" data-section="archives">Archives</a>
        <a href="#profile" data-section="profile">Mon profil</a>
      </nav>
    </aside>
    <main id="account-main" tabindex="-1">
      <p id="account-status" role="status" aria-live="polite"></p>
      <div id="account-content" aria-busy="true"></div>
    </main>
  </div>
  <script type="module" src="./account-page.js"></script>
</body>
</html>
